name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # ============================================================================
  # FRONTEND TESTS
  # ============================================================================
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend linter
        working-directory: ./frontend
        run: npm run lint -- --max-warnings=20

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 1

  # ============================================================================
  # BACKEND UNIT TESTS
  # ============================================================================
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run linter
        working-directory: ./backend
        run: |
          python -m ruff check app/ || true

      - name: Run unit tests
        working-directory: ./backend
        run: |
          python -m pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend-unit
          name: backend-unit-tests
        if: always()

  # ============================================================================
  # BACKEND INTEGRATION TESTS
  # ============================================================================
  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
      SECRET_KEY: test-secret-key-for-ci-only
      JWT_SECRET_KEY: test-jwt-secret-key-for-ci-only
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      ENVIRONMENT: test
      DEBUG: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install psycopg2-binary  # Ensure PostgreSQL driver is installed

      - name: Run database migrations
        working-directory: ./backend
        run: |
          alembic upgrade head

      - name: Run integration tests
        working-directory: ./backend
        run: |
          python -m pytest tests_integration/ -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload integration test coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend-integration
          name: backend-integration-tests
        if: always()

  # ============================================================================
  # BACKEND MIGRATIONS
  # ============================================================================
  backend-migrations:
    name: Backend Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: mig_user
          POSTGRES_PASSWORD: mig_password
          POSTGRES_DB: mig_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://mig_user:mig_password@localhost:5432/mig_db
      TEST_POSTGRES_URL: postgresql+asyncpg://mig_user:mig_password@localhost:5432/mig_db
      SECRET_KEY: test-secret-key-for-ci-only
      ENVIRONMENT: test
      DEBUG: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Upgrade to head
        working-directory: ./backend
        run: alembic upgrade head

      - name: Downgrade to base
        working-directory: ./backend
        run: alembic downgrade base

      - name: Upgrade to head again
        working-directory: ./backend
        run: alembic upgrade head

      - name: Check for model/migration drift
        working-directory: ./backend
        run: alembic check

      - name: Check RESTRICT foreign keys against Postgres
        working-directory: ./backend
        run: python -m pytest tests_integration/test_restrict_postgres.py -v

      - name: Run full test suite
        working-directory: ./backend
        run: python -m pytest -q

  # ============================================================================
  # SUMMARY
  # ============================================================================
  summary:
    name: CI/CD Summary
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-unit-tests, backend-integration-tests, backend-migrations]
    if: always()
    
    steps:
      - name: Check results
        run: |
          echo "## CI/CD Pipeline Results"
          echo "- Frontend Tests: ${{ needs.frontend-tests.result }}"
          echo "- Backend Unit Tests: ${{ needs.backend-unit-tests.result }}"
          echo "- Backend Integration Tests: ${{ needs.backend-integration-tests.result }}"
          echo "- Backend Migrations: ${{ needs.backend-migrations.result }}"
          
          if [ "${{ needs.frontend-tests.result }}" = "failure" ] || \
             [ "${{ needs.backend-unit-tests.result }}" = "failure" ] || \
             [ "${{ needs.backend-integration-tests.result }}" = "failure" ] || \
             [ "${{ needs.backend-migrations.result }}" = "failure" ]; then
            echo "❌ Pipeline failed - tests did not pass"
            exit 1
          fi
          
          echo "✅ All checks passed!"
